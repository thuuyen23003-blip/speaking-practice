want to watch the water and wait for the warm weather."],["/s/","Steve says the sun is so strong that he sits inside and sips a cold soda. Surely, summer is his best season."],["/s/","Pass the sauce, please, Sue. Is this salt or sugar? ‘It’s sweet, so it’s surely the sugar.’"],["/z/","Zoe visits the zoo every Saturday. ‘Those zebras are amazing,’ she says, ‘and the buzzing bees are crazy!’"],["/z/","The boys’ voices were noisy. His cousins are easy to please, and Rosie’s music is as loud as ours."],["/h/","Hello, Harry! How are you? I hope your whole family is happy and healthy at home."],["/j/","Yes, your university has a huge yard. Yesterday, a few young Europeans used the music room in the beautiful old building."],["/p/, /b/","Peter put a big blue bag by the bed. ‘Be polite, Barbara, but please pick up the paper, the pen and the pillow.’"],["/t/, /d/","Did Ted take the ticket today? ‘Don’t tell Dad,’ says Tina. ‘I tried, but I didn’t do it right.’"],["/k/, /g/","Kate got a gift: a gold clock. ‘Great!’ said Gary. ‘Can you get me a cup of coffee, a good cake and a glass of cold milk?’"],["/f/","Fifty-five friends fly to France in February. ‘It’s fantastic for a few photos,’ says Phil, ‘and the food is fresh and fine.’"],["/m/, /n/","Nick makes noodles every Monday morning. ‘Mmm, nice!’ says Mum. ‘Not many of my neighbours make them on their own.’"],["-s /s/","Kate drinks black tea and eats soups, cakes and biscuits. Her friend Jack walks to work and talks about books."],["-s /z/","Anna’s dogs and cars are on the roads. She reads magazines, plays games, and says hello to her friends, sons and daughters."],["-es /ɪz/","Alice washes dishes, watches TV, and fixes glasses. Dad catches buses, uses boxes, and teaches classes."],["-ed /t/","Yesterday, I walked, talked, washed, cooked and watched TV. I also helped my brother and stopped at the shop."],["-ed /d/","We played, learned, cleaned, opened, called and enjoyed the party. My friend arrived and showed me how she changed her hair."],["-ed /ɪd/","He wanted a rest, needed a break, and decided to visit his aunt. She waited at the station, and they started and ended the day in the garden."],["final sounds","Sit, wait, and eat. The black cap, the red hat, the big bag and the cup are on the desk."],["final sounds","I made soup and bread at night. The cup is full, the cat is fat, and the ham is hot."],["/ɪ/ – /iː/","Is it a ship or a sheep? Please sit on that seat, and don’t leave if you live near. The bit of cheese is cheap."],["/æ/ – /e/","The man and ten men sat on a bad bed. Pat had a pan, Pet had a pen. Say ‘bad, bed, bad, bed’ ten times."],["/ʌ/ – /ɑː/","Mark, cut the bun, but don’t cart the bread. It’s luck, not a lark: a hut in the park, a cup in the car."],["/l/ – /r/","Is it a light or a right? Lake or rake? Larry likes the right light, and Rita likes the red lorry."],["/s/ – /ʃ/","Sue sees a ship at the seaside. She says, ‘Sip the soup, then shop at the station. See you, Sheila!’"],["/θ/ – /s/, /t/","Is Tom sick or thick? Thank you for the three trees! I think the sink is full of thin soup."],["/v/ – /w/","Will visits the vet on a wet Wednesday. Vera wears a vest in the west, and she drinks wine near the vine."]];
const LONG=[["Introducing myself","/ɪ/, /iː/, /ə/","Hi, everyone! My name is Linh, and I’m a teacher from a small city near the sea. I live with my family in a big house with a green garden. In my free time, I like reading, cooking and meeting new people. I think English is really important, so I practise a little every day. This is my first time speaking in this class, and I’m a bit nervous, but I’m very happy to be here."],["My daily routine","-s, -ed endings","I usually get up at six, wash my face and brush my teeth. Then I make breakfast: eggs, bread and a cup of tea. I leave home at seven and take the bus to work. At twelve, I have lunch with my colleagues. Yesterday, I worked until six, cooked dinner, watched a movie and talked to my mother on the phone. After that, I washed the dishes and went to bed."],["At the restaurant","/ʃ/, /tʃ/, /s/, /z/","Good evening! Can we have a table for six, please? We’d like fish and chips, chicken soup and a fresh salad. Could we have some juice, a glass of water and cheese sandwiches for the children? Is there a special dish today? Thank you, the service is excellent! Please bring the bill when we finish. And could we have some more sugar and a few spoons? It’s a nice place, and the staff are very polite."],["Asking for directions","/eə/, /ɪə/, /əʊ/","Excuse me, is there a bank near here? Yes, there’s one near the station. Go straight ahead, turn left at the corner and walk past the post office. It’s on your right, next to the café, opposite the park. Is it far? No, it’s only five minutes on foot. Oh, I see. Thanks a lot! You’re welcome. Have a nice day, and take care on the road!"],["Shopping for clothes","/ʃ/, /θ/, /ð/","I’m looking for a shirt and some shoes. Do you have this in a different size? These shoes are too small, and those trousers are too long. The cotton one is thinner, so I think I’ll take both. How much is the black jacket? That’s cheaper than the other one, thank you. I’ll pay with cash. Could I have a bag for them, please? Thanks for your help, and have a lovely Thursday!"],["My family","/ʌ/, /ɑː/, /ð/","There are five people in my family: my mother, my father, my brother, my grandmother and me. My mother is a nurse, and my father works in a bank. My brother is younger than I am, and he loves football and computer games. My grandmother lives with us, and she cooks wonderful meals on Sundays. We often have lunch together, and afterwards we talk, laugh and walk in the park. I’m proud of my lovely, warm family."],["The weather","/θ/, /ð/, /w/","The weather in my country is very different in the north and the south. In the north, it’s cold and wet in winter, with thick clouds and a strong wind. In the south, it’s warm and sunny, and the weather is rather hot in the summer. Whether it rains or not, I like to walk by the water. This Thursday, the forecast says it’ll be thirty degrees, so I’ll wear a thin shirt and bring a bottle of water."],["At the airport","/eɪ/, /aɪ/, /əʊ/","Hello! I’d like to check in for my flight to Rome. Here’s my passport and my ticket. Is it a window or an aisle seat? I’d like a window, please. Can I take this bag on the plane? Yes, it’s fine, but the other one is too heavy. Oh no! I’ll pay for it. Which gate is it? Gate eight. The flight is on time, so you’ll board at nine. Thank you, and have a nice trip!"],["A job interview","/dʒ/, /ʒ/, /ŋ/","Good morning! Thank you for inviting me. My name is George, and I’m an engineer with five years of experience. I enjoy managing projects and working with young people. Last year, I joined a big company in Japan, and I changed many things in the team. My strengths are leadership, planning and good judgment: I make decisions quickly and measure the results. I’m looking for a challenge, and I think this job is a great match."],["Making plans by phone","/ɒ/, /əʊ/, /aʊ/","Hello, Tom? It’s Rob. What’s on for the weekend? I’d love to go out and have a good time. How about a boat trip on Saturday? Oh, I forgot, I’ve got a lot of homework. Okay, so shall we go on Sunday? Good idea! I’ll phone Joe and Rowan, and we’ll meet downtown around noon. Don’t be late, and don’t forget your coat; it’s going to be cold! See you soon."],["At the doctor’s","/θ/, /ɔː/","Good morning, doctor. I’ve got a sore throat and a cough, and I think I have a bit of a fever. It started on Thursday, and it’s getting worse. I can’t swallow anything, and my mouth feels dry. Should I take something for it? The doctor says, ‘Drink plenty of water, rest for three or four days, and take these tablets after meals.’ Thank you, doctor. I’ll come back if it doesn’t get better by next week."],["My hobbies","/h/, /ŋ/, /iː/","Hello! I have a few hobbies, and I enjoy them very much. I like reading, swimming and listening to music. Every weekend, I go hiking in the hills with my friends. We climb to the top, eat lunch, and take photos of the beautiful scenery. In the evening, I often play the guitar and sing a few songs. I also like learning new things, so I’m taking a cooking class. Hobbies keep me happy and healthy."],["Describing a friend","/dʒ/, /ɜː/, /j/","My best friend is Jenny. She’s a young, friendly nurse, and she works in a big hospital. She’s thirty and has curly brown hair and a warm smile. Jenny is generous, funny and very hard-working. We usually meet at a café on Thursdays, and she always tells me interesting stories about her work. I’m lucky to have such a good friend."],["Cooking a meal","/k/, /g/, /f/, /v/","Let’s cook a good dinner for the family. First, we cut the carrots, the onions and a few green vegetables. Then we fry the chicken in a pan with garlic and a bit of oil. Add some rice, a glass of water and a little salt, and cover the pan. After fifteen minutes, the food is fresh, hot and full of flavour. Don’t forget to serve it with a cold glass of juice. Everyone loves it!"],["A busy day at school","/æ/, /ɑː/, /e/","It’s Monday, and I’m at school. The first class is maths, and the teacher asks a lot of hard questions. After that, we have art, and I paint a picture of a farm with a black cat and a red car. At lunch, I have pasta and a glass of water, and I chat with my classmates about our plans for the weekend. In the afternoon, we practise English in the classroom. I’m happy and a bit tired."],["Weekend plans","/j/, /w/, /v/","What are you doing this weekend? We’re having a party on Saturday, and you’re very welcome to come. We have a big yard and a view of the river. Everyone will bring something: Victor will bring some wine and vegetables, and Will will bring a cake. We’ll play games, watch a movie and have a lot of fun. Please arrive around seven, and wear something warm in case it gets windy."],["The lost wallet","/ɒ/, /ɔː/, -ed endings","Yesterday morning, I lost my wallet. I walked to the shop, talked to the owner and looked in my bag, but it wasn’t there. I called my boss, and he said, ‘Don’t worry, we’ll look for it.’ We searched the office, checked the floor and asked my colleagues. Then a cleaner shouted, ‘I found it!’ It was in the corner, behind the box of coffee. What a lot of stress! I’m so glad, and I thanked everybody."],["Healthy habits","/ɪ/, /θ/, /iː/","I think healthy habits are very important. Every morning, I drink a big glass of water and eat fresh fruit with a little cheese. I exercise three times a week: I swim, jog and sometimes cycle. I also sleep eight hours every night and avoid sweets and fizzy drinks. Both my mind and my body feel better, and I’m less stressed. It’s easy to begin: start with one small thing this month."],["Booking a hotel","/eɪ/, /əʊ/, /aʊ/","Hello, I’d like to book a room for two nights, please. We’ll arrive on Friday and leave on Sunday. Do you have a double room with a nice view? How much is it per night? Does the price include breakfast? Oh, that sounds great! Is there a pool and Wi-Fi? Could you send me the confirmation by email? My name is Joan Brown. Thank you so much!"],["My dreams for the future","/ɜː/, /f/, /uː/","In the future, I want to learn more and work abroad. First, I’d like to improve my English so that I can talk to people from many countries. Then I hope to travel, try new food, and make friends around the world. My dream is to start a school for children, because I believe education is the best way to change the future. I’ll work hard, stay positive and never give up. What are your dreams for the future?"]];
const TW=[["She sells seashells by the seashore.","/ʃ/ – /s/"],["Peter Piper picked a peck of pickled peppers.","/p/"],["Betty Botter bought some butter.","/b/, /t/"],["Red lorry, yellow lorry.","/r/ – /l/"],["How much wood would a woodchuck chuck if a woodchuck could chuck wood?","/w/, /ʊ/, /ʌ/, /tʃ/"],["Fuzzy Wuzzy was a bear. Fuzzy Wuzzy had no hair.","/f/, /z/, /w/"],["Unique New York.","/juː/, /n/"],["Whether the weather is warm, whether the weather is hot, we have to put up with the weather, whether we like it or not.","/w/, /ð/"],["I scream, you scream, we all scream for ice cream.","/s/, /iː/"],["Fred fed Ted bread, and Ted fed Fred bread.","/f/, /t/, /d/, /e/"]];

const $=id=>document.getElementById(id);
const G={
 short:SHORT.map(([f,x],i)=>({chip:(i+1)+" "+f,text:x,tag:"Đoạn ngắn "+(i+1)+": âm "+f})),
 long:LONG.map(([t,f,x],i)=>({chip:(i+1)+". "+t,text:x,tag:"Đoạn dài "+(i+1)+": "+t})),
 tw:TW.map(([x,f],i)=>({chip:(i+1)+" "+f,text:x,tag:"Tongue twister "+(i+1)}))
};
const TABS=[["short","Đoạn ngắn"],["long","Đoạn dài"],["tw","Tongue twister"],["paste","Dán đoạn"]];
const SPEEDS=[["Chậm",65],["Vừa",90],["Nhanh",120],["Rất nhanh",150]];
const IC={
 play:'<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
 redo:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>',
 vol:'<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>'
};
let tab="short",cur=0,wpmV=90,words=[],spans=[],idx=-1,timer=null,cdTimer=null,playing=false;
const stage=$("stage"),playBtn=$("play");

function mk(parent,label,on,fn){const b=document.createElement("button");b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;parent.appendChild(b);}
function drawTabs(){const el=$("tabs");el.textContent="";TABS.forEach(([k,l])=>mk(el,l,k===tab,()=>{tab=k;cur=0;drawTabs();if(k==="paste"){drawChips();clearStage();}else pick(0,true);}));}
function drawChips(){const el=$("chips");el.textContent="";$("prev").disabled=$("next").disabled=tab==="paste";$("paste").hidden=tab!=="paste";el.hidden=tab==="paste";if(tab==="paste")return;G[tab].forEach((it,i)=>mk(el,it.chip,i===cur,()=>pick(i)));const a=el.querySelector('[aria-pressed="true"]');if(a){el.scrollTop=a.offsetTop-el.clientHeight/2;el.scrollLeft=a.offsetLeft-el.clientWidth/2+a.offsetWidth/2;}}
function pick(i,keep){cur=i;const it=G[tab][i];load(it.text,it.tag);drawChips();if(!keep)closeSheet();}

function delay(w){
  let m=1;
  if(/[.!?…]["”’)]*$/.test(w))m=2.4;
  else if(/[,;:]["”’)]*$/.test(w))m=1.7;
  const L=w.replace(/[^A-Za-z]/g,"").length;
  m*=L>7?1.35:L>5?1.12:L<=2?0.8:1;
  return 60000/wpmV*m;
}
function paint(){
  spans.forEach((s,i)=>{s.className="w "+(i<idx?"past":i===idx?"cur":"future");});
  const n=words.length,done=Math.min(idx+1,n);
  $("bar").style.width=(n?done/n*100:0)+"%";
  $("cnt").textContent=!n?"":idx>=n?"Xong":Math.max(done,0)+"/"+n;["play","reset","listen"].forEach(i=>{$(i).disabled=!n;});
  const k=playing?"pause":idx>=n?"redo":"play";
  const cap=playing?"Tạm dừng":idx>=n?"Đọc lại":idx>=0?"Tiếp tục":"Bắt đầu";
  playBtn.innerHTML=IC[k];playBtn.setAttribute("aria-label",cap);$("cap").textContent=cap;follow();
}
function load(text,tag){
  halt();stopSpeech();
  words=text.trim().split(/\s+/);
  const p=$("text");p.textContent="";spans=[];
  words.forEach(w=>{const s=document.createElement("span");s.textContent=w;p.appendChild(s);p.appendChild(document.createTextNode(" "));spans.push(s);});
  $("tag").textContent=tag;$("text").className="";idx=-1;paint();fit();
}
function step(){
  idx++;paint();
  if(idx>=words.length){playing=false;paint();return;}
  timer=setTimeout(step,delay(words[idx]));
}
function halt(){playing=false;clearTimeout(timer);clearInterval(cdTimer);$("cd").hidden=true;}
function start(){
  if(!words.length)return;
  if(idx>=words.length)idx=-1;
  playing=true;paint();
  if(idx===-1){
    let n=3;const cd=$("cd");cd.hidden=false;cd.textContent=n;
    cdTimer=setInterval(()=>{n--;if(n<=0){clearInterval(cdTimer);cd.hidden=true;step();}else cd.textContent=n;},800);
  }else{timer=setTimeout(step,delay(words[idx]));}
}
function toggle(){if(playing){halt();paint();}else start();}
function reset(){halt();idx=-1;paint();stopSpeech();}
function stopSpeech(){if("speechSynthesis" in window)speechSynthesis.cancel();$("lcap").textContent="Nghe mẫu";}
function speak(){
  if(!("speechSynthesis" in window))return;
  if(speechSynthesis.speaking){stopSpeech();return;}
  const u=new SpeechSynthesisUtterance(words.join(" "));
  u.lang="en-GB";u.rate=Math.min(1.3,Math.max(0.5,wpmV/130));
  u.onend=u.onerror=()=>{$("lcap").textContent="Nghe mẫu";};
  $("lcap").textContent="Dừng nghe";speechSynthesis.speak(u);
}

playBtn.onclick=toggle;
$("reset").innerHTML=IC.redo;$("reset").onclick=reset;
$("listen").innerHTML=IC.vol;$("listen").onclick=speak;
if(!("speechSynthesis" in window))$("listen").parentElement.hidden=true;
$("use").onclick=()=>{const t=$("ta").value.trim();if(t){load(t,"Đoạn của bạn");closeSheet();}};
document.addEventListener("keydown",e=>{
  const t=document.activeElement,own=["play","reset","listen","use","prev","next","spd","md"].includes(t.id);
  if(t.tagName==="TEXTAREA")return;
  if(e.code==="Space"&&!own){e.preventDefault();toggle();}
  else if(e.code==="ArrowRight")nav(1);
  else if(e.code==="ArrowLeft")nav(-1);
});
function nav(d){if(tab==="paste")return;const n=G[tab].length;pick((cur+d+n)%n);}
function clearStage(){halt();stopSpeech();words=[];spans=[];idx=-1;$("text").textContent="";$("tag").textContent="";paint();}
function closeSheet(){document.body.classList.remove("sheet");setTimeout(fit,0);}
function fit(){
  const t=$("text");if(!words.length)return;
  const avail=t.parentElement.clientHeight;
  let lo=innerWidth>=960?26:20,hi=innerWidth>=960?54:42;
  while(hi-lo>.5){const m=(lo+hi)/2;t.style.fontSize=m+"px";if(t.offsetHeight>avail)hi=m;else lo=m;}
  t.style.fontSize=lo+"px";follow();
}
function follow(){
  const t=$("text");if(!words.length){t.style.transform="";return;}
  const avail=t.parentElement.clientHeight;
  const over=t.offsetHeight-avail;
  if(over<=0){t.style.transform="";return;}
  const s=spans[Math.max(idx,0)];
  const y=s?s.offsetTop+s.offsetHeight/2-avail/2:0;
  t.style.transform="translateY("+(-Math.min(over,Math.max(0,y)))+"px)";
}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(fit,100);});
if(document.fonts)document.fonts.ready.then(fit);
stage.onclick=e=>{if(e.target.closest(".arr"))return;toggle();};
let tx=0,ty=0;
stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<45){e.preventDefault();nav(dx<0?1:-1);}});
$("prev").onclick=()=>nav(-1);$("next").onclick=()=>nav(1);
const MODES=[["reveal","Hiện dần"],["glow","Tô sáng"]];let mi=0;
function drawSpeed(){$("spd").textContent="Tốc độ: "+SPEEDS.find(x=>x[1]===wpmV)[0];}
function drawMode(){$("md").textContent="Kiểu: "+MODES[mi][1];stage.dataset.mode=MODES[mi][0];}
$("spd").onclick=()=>{const i=SPEEDS.findIndex(x=>x[1]===wpmV);wpmV=SPEEDS[(i+1)%SPEEDS.length][1];drawSpeed();};
$("md").onclick=()=>{mi=(mi+1)%MODES.length;drawMode();};
drawTabs();drawSpeed();drawMode();pick(0,true);
</script>
</body>
</html>
